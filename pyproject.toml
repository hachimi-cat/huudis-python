[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forjio-huudis"
version = "0.6.0"
description = "Official Python SDK for Huudis — email/social/MFA, fine-grained authorization, webhook signature verification, and full admin API (IAM, workspaces, end-users, billing, webhook subscriptions) with OIDC device-flow auth and multi-profile session store."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["auth", "oidc", "openid-connect", "huudis", "forjio", "iam", "jwt"]
authors = [{ name = "Forjio", email = "hello@huudis.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
  "PyJWT[crypto]>=2.9.0",
]

[project.urls]
Homepage = "https://huudis.com"
Documentation = "https://huudis.com/docs"
Source = "https://github.com/hachimi-cat/huudis-python"
Issues = "https://github.com/hachimi-cat/huudis-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["huudis"]
